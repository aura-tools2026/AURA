<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Code Scanner - AURA</title>
<meta name="description" content="Scan QR codes online by uploading an image with AURA QR Code Scanner.">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 18px;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0d12;
    color: #f4f6fb;
    line-height: 1.6;
}

.container {
    width: min(650px, 100%);
    margin: 20px auto;
}

h1 {
    text-align: center;
    font-size: 29px;
    line-height: 1.3;
}

.subtitle {
    color: #a4adbd;
    text-align: center;
    margin-bottom: 25px;
}

/* PROPER CARD BOXES */
.card {
    background: linear-gradient(145deg, #171b25, #11141b);
    border: 1px solid #30394b;
    border-radius: 17px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px #0003;
}

.card h2 {
    margin: 0 0 14px;
    font-size: 21px;
}

.upload-label,
button {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
}

.upload-label {
    background: #ffffff;
    color: #111111;
}

button {
    background: #303746;
    color: #ffffff;
}

.upload-label:active,
button:active {
    transform: scale(.99);
}

input[type="file"] {
    display: none;
}

.small {
    color: #a4adbd;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 0;
}

.result-box {
    background: #0b0d12;
    border: 1px solid #30394b;
    padding: 15px;
    border-radius: 10px;
    margin-top: 12px;
    overflow-wrap: anywhere;
    word-break: break-word;
    line-height: 1.7;
    min-height: 60px;
}

.result-box a {
    display: inline-block;
    color: #a997ff;
    margin-top: 10px;
    overflow-wrap: anywhere;
}

.status {
    color: #86efac;
    font-size: 14px;
    line-height: 1.6;
    margin-top: 12px;
    overflow-wrap: anywhere;
}

.footer {
    color: #7e8798;
    text-align: center;
    font-size: 13px;
    margin-top: 25px;
}

@media (max-width: 480px) {
    body {
        padding: 12px;
    }

    .container {
        margin-top: 12px;
    }

    h1 {
        font-size: 25px;
    }

    .card {
        padding: 17px;
        border-radius: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>📷 QR Code Scanner</h1>

    <p class="subtitle">
        Upload an image containing a QR code and scan it instantly.
    </p>

    <!-- IMAGE UPLOAD CARD -->
    <div class="card">

        <h2>🖼️ Scan from Image</h2>

        <label class="upload-label" for="imageInput">
            📤 Choose QR Code Image
        </label>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
        >

        <p class="small">
            Choose a photo or screenshot containing a QR code.
            Supported image formats depend on your browser.
        </p>

        <p id="status" class="status" aria-live="polite"></p>

    </div>

    <!-- RESULT CARD -->
    <div class="card">

        <h2>✅ Scan Result</h2>

        <div id="result" class="result-box" aria-live="polite">
            Your scanned QR code result will appear here.
        </div>

        <button id="copyBtn" type="button">
            📋 Copy Result
        </button>

        <button id="clearBtn" type="button">
            🗑️ Clear Result
        </button>

    </div>

    <div class="footer">
        © 2026 AURA | QR Code Scanner
    </div>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
const imageInput = document.getElementById("imageInput");
const resultBox = document.getElementById("result");
const statusBox = document.getElementById("status");

let lastResult = "";

function showResult(text) {
    lastResult = text;

    resultBox.replaceChildren();

    const textElement = document.createElement("div");
    textElement.textContent = text;
    resultBox.appendChild(textElement);

    // Make normal web links clickable.
    try {
        const url = new URL(text);

        if (url.protocol === "https:" || url.protocol === "http:") {
            const link = document.createElement("a");

            link.href = url.href;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "Open Link →";

            resultBox.appendChild(link);
        }
    } catch (error) {
        // Other QR data is displayed as plain text.
    }

    statusBox.textContent = "✅ QR code scanned successfully!";
}

imageInput.addEventListener("change", async function() {
    const file = imageInput.files && imageInput.files[0];

    if (!file) return;

    if (typeof Html5Qrcode === "undefined") {
        statusBox.textContent =
            "Scanner library load nahi hui. Internet check karke page reload karein.";

        imageInput.value = "";
        return;
    }

    if (!file.type.startsWith("image/")) {
        statusBox.textContent = "Please select a valid image file.";
        imageInput.value = "";
        return;
    }

    statusBox.textContent = "⏳ Image scan ho rahi hai...";

    let imageScanner;

    try {
        imageScanner = new Html5Qrcode("result");

        const decodedText = await imageScanner.scanFile(file, false);

        showResult(decodedText);

    } catch (error) {
        statusBox.textContent =
            "❌ QR code nahi mila. Clear aur poori QR image select karke dobara try karein.";

    } finally {
        if (imageScanner) {
            try {
                await imageScanner.clear();
            } catch (error) {
                // Ignore cleanup errors.
            }
        }

        imageInput.value = "";
    }
});

document.getElementById("copyBtn").addEventListener("click", async function() {
    if (!lastResult) {
        statusBox.textContent = "Pehle QR code image scan karein.";
        return;
    }

    try {
        await navigator.clipboard.writeText(lastResult);
        statusBox.textContent = "✅ Result copied!";
    } catch (error) {
        statusBox.textContent =
            "Copy nahi hua. Result ko select karke manually copy karein.";
    }
});

document.getElementById("clearBtn").addEventListener("click", function() {
    lastResult = "";

    resultBox.textContent =
        "Your scanned QR code result will appear here.";

    statusBox.textContent = "";
});
</script>

</body>
    </html>
