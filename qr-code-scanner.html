<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Code Scanner - AURA</title>
<meta name="description" content="Scan QR codes online from images with AURA QR Code Scanner.">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 18px;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0d12;
    color: #f4f6fb;
    line-height: 1.6;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: 20px auto;
}

h1 {
    text-align: center;
    font-size: 29px;
    margin-bottom: 8px;
}

.subtitle {
    color: #a4adbd;
    text-align: center;
    margin: 0 0 28px;
}

.card {
    background: linear-gradient(145deg, #171b25, #11141b);
    border: 1px solid #30394b;
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 22px;
    box-shadow: 0 5px 20px #0003;
}

.card h2 {
    margin: 0 0 18px;
    font-size: 23px;
}

button,
.upload-label {
    display: block;
    width: 100%;
    padding: 15px;
    margin-top: 14px;
    border: 1px solid transparent;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
    font-family: inherit;
}

.upload-label {
    background: #fff;
    color: #111;
}

.upload-label:active,
button:active {
    transform: scale(.99);
}

input[type="file"] {
    display: none;
}

.secondary {
    background: #303747;
    border-color: #3b4559;
    color: #fff;
}

.small {
    color: #a4adbd;
    font-size: 14px;
    line-height: 1.7;
    margin: 16px 0 0;
}

/* RESULT BOX */
.result-box {
    width: 100%;
    min-height: 100px;
    padding: 16px;
    background: #ffffff;
    color: #111827;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    margin-top: 10px;
    overflow-wrap: anywhere;
    word-break: break-word;
    white-space: pre-wrap;
    line-height: 1.7;
    font-size: 16px;
}

.result-box a {
    display: inline-block;
    margin-top: 10px;
    color: #075dcc;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.status {
    color: #86efac;
    font-size: 14px;
    line-height: 1.6;
    margin-top: 14px;
    overflow-wrap: anywhere;
}

.status.error {
    color: #fca5a5;
}

.footer {
    color: #7e8798;
    text-align: center;
    font-size: 13px;
    margin: 28px 0;
}

@media(max-width:480px) {
    body {
        padding: 12px;
    }

    .container {
        margin-top: 12px;
    }

    .card {
        padding: 17px;
        border-radius: 17px;
    }

    h1 {
        font-size: 25px;
    }

    .card h2 {
        font-size: 21px;
    }

    button,
    .upload-label {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>📷 QR Code Scanner</h1>

    <p class="subtitle">
        Upload an image containing a QR code and scan it instantly.
    </p>

    <!-- IMAGE SCANNER CARD -->
    <div class="card">

        <h2>🖼️ Scan from Image</h2>

        <label class="upload-label" for="imageInput">
            📤 Choose QR Code Image
        </label>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
        >

        <p class="small">
            Choose a photo or screenshot containing a QR code.
            Supported image formats depend on your browser.
        </p>

        <p id="scanStatus" class="status" aria-live="polite"></p>

    </div>

    <!-- RESULT CARD -->
    <div class="card">

        <h2>✔️ Scan Result</h2>

        <div id="result" class="result-box" aria-live="polite">
            Your scanned QR code result will appear here.
        </div>

        <button class="secondary" id="copyBtn" type="button">
            📋 Copy Result
        </button>

        <button class="secondary" id="clearBtn" type="button">
            🗑️ Clear Result
        </button>

        <p id="actionStatus" class="status" aria-live="polite"></p>

    </div>

    <div class="footer">
        © 2026 AURA | QR Code Scanner
    </div>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
const imageInput = document.getElementById("imageInput");
const resultBox = document.getElementById("result");
const scanStatus = document.getElementById("scanStatus");
const actionStatus = document.getElementById("actionStatus");

const copyBtn = document.getElementById("copyBtn");
const clearBtn = document.getElementById("clearBtn");

const defaultMessage =
    "Your scanned QR code result will appear here.";

let lastResult = "";

function setStatus(element, message, isError = false) {
    element.textContent = message;
    element.classList.toggle("error", isError);
}

function showResult(text) {
    lastResult = text;

    // Clear previous content.
    resultBox.replaceChildren();

    // Show decoded QR text in a visible text colour.
    const textNode = document.createElement("div");
    textNode.textContent = text;
    resultBox.appendChild(textNode);

    // Make HTTP and HTTPS links clickable.
    try {
        const url = new URL(text);

        if (url.protocol === "http:" || url.protocol === "https:") {
            const link = document.createElement("a");
            link.href = url.href;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "Open link ↗";
            resultBox.appendChild(link);
        }
    } catch (error) {
        // Non-URL content remains visible as ordinary text.
    }

    setStatus(scanStatus, "✔️ QR code scanned successfully!");
    setStatus(actionStatus, "");
}

imageInput.addEventListener("change", async function() {
    const file = imageInput.files && imageInput.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        setStatus(scanStatus, "Please select a valid image file.", true);
        imageInput.value = "";
        return;
    }

    if (typeof Html5Qrcode === "undefined") {
        setStatus(
            scanStatus,
            "Scanner library load nahi hui. Internet check karke page reload karein.",
            true
        );
        imageInput.value = "";
        return;
    }

    setStatus(scanStatus, "⏳ Image scan ho rahi hai...");
    setStatus(actionStatus, "");

    try {
        const imageScanner = new Html5Qrcode("imageScannerHelper");
        const decodedText = await imageScanner.scanFile(file, false);

        showResult(decodedText);

    } catch (error) {
        setStatus(
            scanStatus,
            "❌ QR code nahi mila. Clear aur poori QR image select karein.",
            true
        );
    } finally {
        imageInput.value = "";
    }
});

copyBtn.addEventListener("click", async function() {
    if (!lastResult) {
        setStatus(actionStatus, "Pehle QR code scan karein.", true);
        return;
    }

    try {
        await navigator.clipboard.writeText(lastResult);
        setStatus(actionStatus, "✔️ Result copied successfully!");
    } catch (error) {
        // Fallback for browsers where Clipboard API is unavailable.
        const textArea = document.createElement("textarea");
        textArea.value = lastResult;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";

        document.body.appendChild(textArea);
        textArea.select();

        try {
            const copied = document.execCommand("copy");

            setStatus(
                actionStatus,
                copied
                    ? "✔️ Result copied successfully!"
                    : "Result copy nahi hua. Text ko manually select karein.",
                !copied
            );
        } catch (copyError) {
            setStatus(
                actionStatus,
                "Result copy nahi hua. Text ko manually select karein.",
                true
            );
        }

        textArea.remove();
    }
});

clearBtn.addEventListener("click", function() {
    // Delete the stored QR result.
    lastResult = "";

    // Restore the default message visibly.
    resultBox.replaceChildren();
    resultBox.textContent = defaultMessage;

    // Clear status messages and reset image selection.
    setStatus(scanStatus, "");
    setStatus(actionStatus, "");
    imageInput.value = "";
});

/* Hidden helper required by the QR scanning library. */
const helper = document.createElement("div");
helper.id = "imageScannerHelper";
helper.style.display = "none";
document.body.appendChild(helper);
</script>

</body>
    </html>
