<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Advanced Word Counter - AURA</title>

<meta name="description" content="Count words, sentences and paragraphs instantly with AURA's free advanced word counter.">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
    padding: 20px;
}

header {
    text-align: center;
    padding: 20px 0 30px;
}

header h1 {
    font-size: 32px;
    color: #2563eb;
}

header p {
    color: #64748b;
    margin-top: 10px;
}

.container {
    max-width: 850px;
    margin: auto;
}

.editor {
    background: white;
    padding: 22px;
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.06);
}

textarea {
    width: 100%;
    height: 260px;
    padding: 16px;
    border: 1px solid #dbe3ef;
    border-radius: 10px;
    font-size: 16px;
    line-height: 1.7;
    resize: vertical;
    outline: none;
}

textarea:focus {
    border-color: #2563eb;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.copy {
    background: #2563eb;
    color: white;
}

.clear {
    background: #fee2e2;
    color: #b91c1c;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 22px;
}

.card {
    background: white;
    text-align: center;
    padding: 22px 10px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.04);
}

.card h2 {
    font-size: 30px;
    color: #2563eb;
    margin-bottom: 8px;
}

.card p {
    color: #64748b;
    font-size: 14px;
}

.extra {
    background: white;
    margin-top: 18px;
    padding: 20px;
    border-radius: 12px;
    display: flex;
    justify-content: space-around;
    gap: 15px;
    text-align: center;
    flex-wrap: wrap;
}

.extra strong {
    display: block;
    font-size: 20px;
    margin-bottom: 6px;
}

.extra span {
    color: #64748b;
    font-size: 13px;
}

footer {
    text-align: center;
    color: #64748b;
    padding: 30px 0 10px;
    font-size: 14px;
}

@media (max-width: 500px) {
    body {
        padding: 12px;
    }

    .stats {
        gap: 8px;
    }

    .card {
        padding: 18px 5px;
    }

    .card h2 {
        font-size: 25px;
    }

    header h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<header>
    <h1>AURA</h1>
    <p>Advanced Word Counter</p>
</header>

<main class="container">

    <section class="editor">
        <textarea id="textInput"
        placeholder="Type or paste your text here..."></textarea>

        <div class="buttons">
            <button class="copy" onclick="copyText()">📋 Copy Text</button>
            <button class="clear" onclick="clearText()">✖ Clear All</button>
        </div>
    </section>

    <section class="stats">

        <div class="card">
            <h2 id="wordCount">0</h2>
            <p>Words</p>
        </div>

        <div class="card">
            <h2 id="sentenceCount">0</h2>
            <p>Sentences</p>
        </div>

        <div class="card">
            <h2 id="paragraphCount">0</h2>
            <p>Paragraphs</p>
        </div>

    </section>

    <section class="extra">
        <div>
            <strong id="charCount">0</strong>
            <span>Characters</span>
        </div>

        <div>
            <strong id="charNoSpace">0</strong>
            <span>Characters (without spaces)</span>
        </div>

        <div>
            <strong id="readingTime">0 min</strong>
            <span>Reading Time</span>
        </div>
    </section>

</main>

<footer>
    © 2026 AURA | Free Online Word Counter
</footer>

<script>
const textInput = document.getElementById("textInput");

function countText() {
    const text = textInput.value;

    const trimmed = text.trim();

    const words = trimmed
        ? trimmed.split(/\s+/).length
        : 0;

    const sentences = trimmed
        ? (trimmed.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [])
            .filter(s => s.trim().length > 0).length
        : 0;

    const paragraphs = text
        .split(/\n\s*\n/)
        .filter(p => p.trim().length > 0).length;

    const characters = text.length;

    const charactersNoSpaces = text
        .replace(/\s/g, "").length;

    const minutes = words === 0
        ? 0
        : Math.ceil(words / 200);

    document.getElementById("wordCount").textContent = words;
    document.getElementById("sentenceCount").textContent = sentences;
    document.getElementById("paragraphCount").textContent = paragraphs;
    document.getElementById("charCount").textContent = characters;
    document.getElementById("charNoSpace").textContent = charactersNoSpaces;

    document.getElementById("readingTime").textContent =
        minutes + (minutes === 1 ? " min" : " min");
}

function clearText() {
    textInput.value = "";
    countText();
    textInput.focus();
}

async function copyText() {
    const text = textInput.value;

    if (!text) {
        alert("Please enter some text first!");
        return;
    }

    try {
        await navigator.clipboard.writeText(text);
        alert("Text copied successfully!");
    } catch (error) {
        textInput.select();
        const copied = document.execCommand("copy");
        alert(copied ? "Text copied successfully!" : "Please copy the selected text manually.");
    }
}

textInput.addEventListener("input", countText);

countText();
</script>

</body>
 </html>
