<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Generator | AURA</title>
<meta name="description" content="Generate secure random passwords with AURA Password Generator.">
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#06120d;color:#eafff2;font-family:Arial,sans-serif}
.app{max-width:650px;margin:20px auto}
header{text-align:center;margin-bottom:25px}
.brand{font-size:12px;letter-spacing:4px;color:#81ffb8}
h1{font-size:32px;margin:14px 0}
h1 span{color:#40ff98}
p{color:#a8c5b4;line-height:1.6}
.panel{background:#0d2017;border:1px solid #245a3e;border-radius:20px;padding:22px;margin:18px 0;box-shadow:0 0 25px #40ff9809}
label{display:block;margin:15px 0 9px;color:#c9f4d9}
.output{display:flex;gap:8px}
.output input{min-width:0;width:100%;background:#06140e;color:#77ffb3;border:1px solid #2d704c;border-radius:10px;padding:14px;font-size:15px}
button{padding:13px;border:0;border-radius:10px;background:#40ff98;color:#052014;font-weight:bold;cursor:pointer}
.output button{min-width:85px}
#length{width:100%;accent-color:#40ff98}
.length-row{display:flex;justify-content:space-between;margin:12px 0;color:#a8c5b4}
#lengthValue{color:#40ff98;font-weight:bold}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.option{background:#10291d;border:1px solid #245a3e;border-radius:10px;padding:13px}
.option label{margin:0;display:flex;align-items:center;gap:8px;cursor:pointer}
input[type=checkbox]{accent-color:#40ff98;width:17px;height:17px}
.generate{width:100%;margin-top:20px;padding:15px}
.strength{height:8px;background:#244132;border-radius:10px;overflow:hidden;margin-top:18px}
#bar{height:100%;width:0;background:#40ff98;transition:width .2s}
#strengthText,#status{font-size:13px;margin-top:10px;overflow-wrap:anywhere}
.back{display:block;text-align:center;color:#81ffb8;text-decoration:none;margin-top:25px}
@media(max-width:390px){.options{grid-template-columns:1fr}.output button{min-width:72px}}
</style>
</head>
<body>
<main class="app">
<header>
<div class="brand">A U R A / SECURITY LAB</div>
<h1>PASSWORD <span>GENERATOR</span></h1>
<p>Create random passwords with your own security settings.</p>
</header>

<section class="panel">
<label for="password">GENERATED PASSWORD</label>
<div class="output">
<input id="password" type="text" readonly autocomplete="off" placeholder="Your password appears here">
<button id="copy" type="button">COPY</button>
</div>

<div class="strength"><div id="bar"></div></div>
<div id="strengthText" aria-live="polite">Strength estimate will appear here.</div>

<label for="length">PASSWORD LENGTH</label>
<div class="length-row"><span>8–64 characters</span><strong id="lengthValue">20</strong></div>
<input id="length" type="range" min="8" max="64" value="20">

<label>INCLUDE CHARACTERS</label>
<div class="options">
<div class="option"><label><input type="checkbox" id="lower" checked> Lowercase</label></div>
<div class="option"><label><input type="checkbox" id="upper" checked> Uppercase</label></div>
<div class="option"><label><input type="checkbox" id="numbers" checked> Numbers</label></div>
<div class="option"><label><input type="checkbox" id="symbols" checked> Symbols</label></div>
</div>

<button id="generate" class="generate" type="button">GENERATE PASSWORD ↻</button>
<div id="status" role="status" aria-live="polite"></div>
<p>Generated in your browser. Keep your password private and consider using a trusted password manager.</p>
</section>
<a class="back" href="index.html">← Back to AURA</a>
</main>

<script>
const output=document.getElementById("password");
const lengthInput=document.getElementById("length");
const lengthValue=document.getElementById("lengthValue");
const status=document.getElementById("status");
const bar=document.getElementById("bar");
const strengthText=document.getElementById("strengthText");

lengthInput.addEventListener("input",()=>lengthValue.textContent=lengthInput.value);

function randomIndex(max){
 const limit=Math.floor(4294967296/max)*max;
 const array=new Uint32Array(1);
 let n;
 do{crypto.getRandomValues(array);n=array[0]}while(n>=limit);
 return n%max;
}
function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  const j=randomIndex(i+1);
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}
function generate(){
 if(!window.crypto||!crypto.getRandomValues){
  status.textContent="Secure random generation is unavailable in this browser.";
  return;
 }
 const groups=[];
 if(document.getElementById("lower").checked)groups.push("abcdefghijklmnopqrstuvwxyz");
 if(document.getElementById("upper").checked)groups.push("ABCDEFGHIJKLMNOPQRSTUVWXYZ");
 if(document.getElementById("numbers").checked)groups.push("0123456789");
 if(document.getElementById("symbols").checked)groups.push("!@#$%^&*()-_=+[]{};:,.?");
 const length=Number(lengthInput.value);
 if(!groups.length){
  status.textContent="Select at least one character type.";
  return;
 }
 if(length<groups.length){
  status.textContent="Increase the length to include every selected type.";
  return;
 }
 const all=groups.join("");
 let chars=groups.map(g=>g[randomIndex(g.length)]);
 while(chars.length<length)chars.push(all[randomIndex(all.length)]);
 output.value=shuffle(chars).join("");
 status.textContent="New password generated.";
 const entropy=length*Math.log2(all.length);
 const strength=entropy<40?"Weak":entropy<65?"Moderate":entropy<90?"Strong":"Very strong";
 bar.style.width=Math.min(100,entropy)+"%";
 strengthText.textContent="Estimated strength: "+strength;
}
document.getElementById("generate").addEventListener("click",generate);
document.getElementById("copy").addEventListener("click",async()=>{
 if(!output.value){status.textContent="Generate a password first.";return}
 try{
  await navigator.clipboard.writeText(output.value);
  status.textContent="Password copied. Keep it private.";
 }catch(e){
  output.focus();output.select();
  status.textContent=document.execCommand("copy")?"Password copied. Keep it private.":"Copy manually from the selected password.";
 }
});
generate();
</script>
</body>
                             </html>
