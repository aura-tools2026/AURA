
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Code Generator - AURA</title>

<!-- QR GENERATOR LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#050505;
  --card:#0c0c0c;
  --border:rgba(255,255,255,.16);
  --text:#fff;
  --muted:#999;
  --soft:#151515;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

/* HEADER */
header{
  height:70px;
  border-top:1px solid rgba(255,255,255,.28);
  border-left:1px solid rgba(255,255,255,.28);
  border-right:1px solid rgba(255,255,255,.28);
  border-bottom:1px solid var(--border);
  width:100%;
  display:flex;
  align-items:center;
  padding:0 20px;
}

.logo{
  text-decoration:none;
  color:white;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:21px;
  font-weight:800;
}

.logo-icon{
  width:35px;
  height:35px;
  border:1px solid rgba(255,255,255,.3);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

/* MAIN FRAME */
main{
  width:100%;
  min-height:calc(100vh - 70px);
  border-left:1px solid rgba(255,255,255,.28);
  border-right:1px solid rgba(255,255,255,.28);
}

/* BACK */
.back{
  display:inline-block;
  margin:25px 20px 0;
  color:#aaa;
  text-decoration:none;
  font-size:14px;
}

.back:hover{
  color:#fff;
}

/* HERO */
.hero{
  text-align:center;
  padding:45px 20px 35px;
  border-bottom:1px solid rgba(255,255,255,.22);
}

.badge{
  display:inline-block;
  padding:7px 13px;
  border:1px solid var(--border);
  border-radius:30px;
  color:#aaa;
  font-size:12px;
  margin-bottom:17px;
}

.hero h1{
  font-size:42px;
  line-height:1.1;
  margin-bottom:15px;
}

.hero h1 span{
  color:#888;
}

.hero p{
  color:#999;
  max-width:650px;
  margin:auto;
  line-height:1.6;
}

/* TOOL AREA */
.tool-area{
  max-width:1100px;
  margin:auto;
  padding:35px 20px 60px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:24px;
}

.card h2{
  font-size:18px;
  margin-bottom:18px;
}

/* TABS */
.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:20px;
}

.tab{
  background:#111;
  color:#aaa;
  border:1px solid var(--border);
  padding:10px 13px;
  border-radius:10px;
  cursor:pointer;
}

.tab.active{
  background:#fff;
  color:#000;
}

/* INPUT */
label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin-bottom:7px;
}

input,textarea,select{
  width:100%;
  background:#090909;
  color:#fff;
  border:1px solid var(--border);
  border-radius:10px;
  padding:13px;
  outline:none;
  margin-bottom:16px;
  font-size:14px;
}

textarea{
  min-height:120px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:rgba(255,255,255,.5);
}

/* BUTTONS */
.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  border:none;
  cursor:pointer;
  padding:12px 18px;
  border-radius:10px;
  font-weight:700;
}

.primary{
  background:#fff;
  color:#000;
}

.secondary{
  background:#151515;
  color:#fff;
  border:1px solid var(--border);
}

button:hover{
  transform:translateY(-1px);
}

/* PREVIEW */
.preview{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.qr-box{
  width:360px;
  max-width:100%;
  min-height:360px;
  background:#fff;
  border-radius:14px;
  padding:20px;
  display:flex;
  justify-content:center;
  align-items:center;
}

#qrCanvas{
  display:block;
  max-width:100%;
  height:auto;
}

.status{
  color:#999;
  font-size:13px;
  margin-top:15px;
  text-align:center;
}

.encoded{
  width:100%;
  margin-top:20px;
  padding:15px;
  background:#090909;
  border:1px solid var(--border);
  border-radius:10px;
  color:#aaa;
  font-size:13px;
  word-break:break-word;
}

.encoded strong{
  color:#fff;
}

/* ADVANCED */
.advanced{
  margin-top:20px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.color-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

input[type="color"]{
  height:48px;
  padding:4px;
  cursor:pointer;
}

/* FOOTER */
footer{
  border-top:1px solid var(--border);
  text-align:center;
  padding:25px 20px;
  color:#777;
  font-size:13px;
}

/* MOBILE */
@media(max-width:700px){

  .hero{
    padding:35px 18px 30px;
  }

  .hero h1{
    font-size:31px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .tool-area{
    padding:25px 15px 45px;
  }

  .card{
    padding:18px;
  }

  .qr-box{
    min-height:300px;
    padding:18px;
  }

  .row,
  .color-row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="logo">
    <span class="logo-icon">✦</span>
    AURA
  </a>
</header>

<main>

<a href="index.html" class="back">← Back to AURA</a>

<section class="hero">

  <div class="badge">Advanced QR Tool</div>

  <h1>
    QR Code<br>
    <span>Generator</span>
  </h1>

  <p>
    Create reliable QR codes for text, websites, Wi-Fi,
    email, phone numbers and more.
  </p>

</section>

<section class="tool-area">

<div class="grid">

<!-- LEFT -->
<div class="card">

  <h2>QR Content</h2>

  <div class="tabs">

    <button class="tab active" data-type="text">Text</button>

    <button class="tab" data-type="url">Website</button>

    <button class="tab" data-type="wifi">Wi-Fi</button>

    <button class="tab" data-type="email">Email</button>

    <button class="tab" data-type="phone">Phone</button>

    <button class="tab" data-type="contact">Contact</button>

  </div>

  <div id="formArea">

    <label>Text</label>

    <textarea id="textInput"
      placeholder="Enter your text here...">Hello AURA! This is my first QR code.</textarea>

  </div>

  <div class="advanced">

    <h2>QR Settings</h2>

    <div class="row">

      <div>
        <label>QR Size</label>

        <select id="size">
          <option value="300">300 × 300</option>
          <option value="400" selected>400 × 400</option>
          <option value="500">500 × 500</option>
          <option value="600">600 × 600</option>
        </select>
      </div>

      <div>
        <label>Error Correction</label>

        <select id="error">
          <option value="L">Low</option>
          <option value="M">Medium</option>
          <option value="Q">Quartile</option>
          <option value="H" selected>High</option>
        </select>
      </div>

    </div>

    <div class="color-row">

      <div>
        <label>QR Color</label>
        <input type="color" id="darkColor" value="#000000">
      </div>

      <div>
        <label>Background</label>
        <input type="color" id="lightColor" value="#ffffff">
      </div>

    </div>

  </div>

  <div class="buttons">

    <button class="primary" onclick="generateQR()">
      Generate QR
    </button>

    <button class="secondary" onclick="clearQR()">
      Clear
    </button>

  </div>

</div>


<!-- RIGHT -->
<div class="card">

  <h2>Live Preview</h2>

  <div class="preview">

    <div class="qr-box">

      <canvas id="qrCanvas"></canvas>

    </div>

    <div class="status" id="status">
      Enter content and generate your QR code.
    </div>

    <div class="encoded">

      <strong>Encoded content:</strong>

      <div id="encodedText">
        Nothing generated yet.
      </div>

    </div>

    <div class="buttons" style="margin-top:20px;">

      <button class="primary" onclick="downloadQR()">
        Download PNG
      </button>

      <button class="secondary" onclick="copyQR()">
        Copy QR
      </button>

    </div>

  </div>

</div>

</div>

</section>

<footer>
  © 2026 AURA · Free Online Tools
</footer>

</main>


<script>

let currentType = "text";

const tabs = document.querySelectorAll(".tab");

tabs.forEach(tab => {

  tab.addEventListener("click", () => {

    tabs.forEach(t => t.classList.remove("active"));

    tab.classList.add("active");

    currentType = tab.dataset.type;

    loadForm();

  });

});


function loadForm(){

  const area = document.getElementById("formArea");

  if(currentType === "text"){

    area.innerHTML = `
      <label>Text</label>
      <textarea id="textInput"
      placeholder="Enter your text here...">Hello AURA! This is my first QR code.</textarea>
    `;

  }

  if(currentType === "url"){

    area.innerHTML = `
      <label>Website URL</label>
      <input id="urlInput"
      type="url"
      placeholder="https://example.com">
    `;

  }

  if(currentType === "wifi"){

    area.innerHTML = `
      <label>Wi-Fi Name (SSID)</label>
      <input id="wifiName" placeholder="My WiFi">

      <label>Wi-Fi Password</label>
      <input id="wifiPass" type="text" placeholder="Password">

      <label>Security</label>
      <select id="wifiSecurity">
        <option value="WPA">WPA/WPA2</option>
        <option value="WEP">WEP</option>
        <option value="nopass">No Password</option>
      </select>
    `;

  }

  if(currentType === "email"){

    area.innerHTML = `
      <label>Email Address</label>
      <input id="emailAddress"
      type="email"
      placeholder="hello@example.com">

      <label>Subject</label>
      <input id="emailSubject"
      placeholder="Subject">

      <label>Message</label>
      <textarea id="emailMessage"
      placeholder="Your message"></textarea>
    `;

  }

  if(currentType === "phone"){

    area.innerHTML = `
      <label>Phone Number</label>
      <input id="phoneNumber"
      type="tel"
      placeholder="+91 9876543210">
    `;

  }

  if(currentType === "contact"){

    area.innerHTML = `
      <label>Name</label>
      <input id="contactName"
      placeholder="Your name">

      <label>Phone</label>
      <input id="contactPhone"
      placeholder="+91 9876543210">

      <label>Email</label>
      <input id="contactEmail"
      type="email"
      placeholder="hello@example.com">

      <label>Organization</label>
      <input id="contactOrg"
      placeholder="Company">
    `;

  }

}


function getQRData(){

  if(currentType === "text"){

    return document.getElementById("textInput").value.trim();

  }

  if(currentType === "url"){

    let value =
      document.getElementById("urlInput").value.trim();

    if(!value) return "";

    if(!/^https?:\/\//i.test(value)){
      value = "https://" + value;
    }

    return value;

  }

  if(currentType === "wifi"){

    const ssid =
      document.getElementById("wifiName").value;

    const pass =
      document.getElementById("wifiPass").value;

    const security =
      document.getElementById("wifiSecurity").value;

    if(!ssid) return "";

    function escapeWifi(value){
      return value
        .replace(/\\/g,"\\\\")
        .replace(/;/g,"\\;")
        .replace(/,/g,"\\,")
        .replace(/:/g,"\\:");
    }

    return `WIFI:T:${security};S:${escapeWifi(ssid)};P:${escapeWifi(pass)};;`;

  }

  if(currentType === "email"){

    const email =
      document.getElementById("emailAddress").value.trim();

    const subject =
      document.getElementById("emailSubject").value.trim();

    const message =
      document.getElementById("emailMessage").value.trim();

    if(!email) return "";

    return `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(message)}`;

  }

  if(currentType === "phone"){

    const phone =
      document.getElementById("phoneNumber").value.trim();

    if(!phone) return "";

    return `tel:${phone}`;

  }

  if(currentType === "contact"){

    const name =
      document.getElementById("contactName").value.trim();

    const phone =
      document.getElementById("contactPhone").value.trim();

    const email =
      document.getElementById("contactEmail").value.trim();

    const org =
      document.getElementById("contactOrg").value.trim();

    if(!name && !phone && !email) return "";

    return `BEGIN:VCARD
VERSION:3.0
FN:${name}
ORG:${org}
TEL:${phone}
EMAIL:${email}
END:VCARD`;

  }

  return "";

}


function generateQR(){

  const data = getQRData();

  if(!data){

    alert("Please enter some content first.");

    return;

  }

  const canvas =
    document.getElementById("qrCanvas");

  const size =
    Number(document.getElementById("size").value);

  const error =
    document.getElementById("error").value;

  const dark =
    document.getElementById("darkColor").value;

  const light =
    document.getElementById("lightColor").value;

  QRCode.toCanvas(
    canvas,
    data,
    {
      width:size,

      margin:4,

      errorCorrectionLevel:error,

      color:{
        dark:dark,
        light:light
      }
    },
    function(err){

      if(err){

        console.error(err);

        document.getElementById("status").textContent =
          "QR generation failed.";

        return;

      }

      document.getElementById("status").textContent =
        "QR generated successfully.";

      document.getElementById("encodedText").textContent =
        data;

    }
  );

}


function downloadQR(){

  const canvas =
    document.getElementById("qrCanvas");

  if(canvas.width === 0){

    alert("Please generate a QR code first.");

    return;

  }

  const link =
    document.createElement("a");

  link.download =
    "AURA-QR-Code.png";

  link.href =
    canvas.toDataURL("image/png");

  link.click();

}


async function copyQR(){

  const canvas =
    document.getElementById("qrCanvas");

  if(canvas.width === 0){

    alert("Please generate a QR code first.");

    return;

  }

  try{

    const blob =
      await new Promise(resolve =>
        canvas.toBlob(resolve,"image/png")
      );

    await navigator.clipboard.write([
      new ClipboardItem({
        "image/png":blob
      })
    ]);

    alert("QR copied successfully!");

  }catch(error){

    alert(
      "Copy is not supported here. Please use Download PNG."
    );

  }

}


function clearQR(){

  const canvas =
    document.getElementById("qrCanvas");

  const ctx =
    canvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  document.getElementById("encodedText").textContent =
    "Nothing generated yet.";

  document.getElementById("status").textContent =
    "Enter content and generate your QR code.";

}


generateQR();

</script>

</body>
  </html>
