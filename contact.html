<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact AURA — Free Online Tools</title>
<meta name="description" content="Contact AURA for questions, feedback and suggestions.">

<style>
:root{
  --bg:#050505;
  --surface:#0c0c0c;
  --border:#252525;
  --text:#fff;
  --muted:#8b8b8b;
  --soft:#bdbdbd;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

.container{
  width:min(900px,92%);
  margin:auto;
}

/* HEADER */

header{
  border-bottom:1px solid var(--border);
  background:rgba(5,5,5,.9);
  backdrop-filter:blur(15px);
}

.nav{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:24px;
  font-weight:900;
  letter-spacing:2px;
  text-decoration:none;
  color:white;
}

.logo-icon{
  width:41px;
  height:41px;
  display:grid;
  place-items:center;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--surface);
  animation:glow 3s ease-in-out infinite;
}

.back{
  color:var(--soft);
  text-decoration:none;
  font-size:14px;
  border:1px solid var(--border);
  padding:10px 15px;
  border-radius:11px;
  transition:.25s;
}

.back:hover{
  color:white;
  transform:translateY(-2px);
  border-color:#555;
}

/* CONTENT */

.contact{
  padding:90px 0;
}

.badge{
  display:inline-block;
  border:1px solid var(--border);
  background:var(--surface);
  padding:8px 14px;
  border-radius:30px;
  color:var(--soft);
  font-size:13px;
  margin-bottom:22px;
  animation:fadeUp .7s ease both;
}

h1{
  font-size:clamp(42px,8vw,72px);
  line-height:1;
  letter-spacing:-4px;
  animation:fadeUp .8s ease .1s both;
}

.subtitle{
  color:var(--muted);
  max-width:600px;
  font-size:17px;
  margin:20px 0 45px;
  animation:fadeUp .8s ease .2s both;
}

/* FORM */

.contact-box{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:22px;
  padding:30px;
  animation:fadeUp .8s ease .3s both;
}

label{
  display:block;
  color:var(--soft);
  font-size:14px;
  margin-bottom:8px;
}

input,
textarea{
  width:100%;
  background:#080808;
  color:white;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  padding:14px;
  margin-bottom:20px;
  transition:.25s;
}

input{
  height:50px;
}

textarea{
  min-height:150px;
  resize:vertical;
}

input:focus,
textarea:focus{
  border-color:#666;
  box-shadow:0 0 25px rgba(255,255,255,.05);
}

button{
  border:0;
  background:white;
  color:#050505;
  padding:13px 22px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
  transition:.25s;
}

button:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 30px rgba(255,255,255,.12);
}

.note{
  color:var(--muted);
  font-size:12px;
  margin-top:15px;
}

/* FOOTER */

footer{
  border-top:1px solid var(--border);
  padding:25px 0;
  color:var(--muted);
  text-align:center;
  font-size:13px;
}

/* ANIMATION */

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes glow{
  0%,100%{
    box-shadow:0 0 0 rgba(255,255,255,0);
  }
  50%{
    box-shadow:0 0 25px rgba(255,255,255,.12);
  }
}

@media(max-width:550px){

  .contact{
    padding:65px 0;
  }

  h1{
    letter-spacing:-2px;
  }

  .contact-box{
    padding:22px;
  }

}
</style>
</head>

<body>

<header>
  <div class="container nav">

    <a href="index.html" class="logo">
      <span class="logo-icon">✦</span>
      AURA
    </a>

    <a href="index.html" class="back">
      ← Back to AURA
    </a>

  </div>
</header>

<main>

<section class="contact">
<div class="container">

<div class="badge">✦ Get in touch</div>

<h1>Contact AURA.</h1>

<p class="subtitle">
Have a question, suggestion or feedback?
Send us a message and help make AURA better.
</p>

<div class="contact-box">

<form onsubmit="sendMessage(event)">

<label for="name">Your Name</label>
<input
  id="name"
  type="text"
  placeholder="Enter your name"
  required
>

<label for="email">Email Address</label>
<input
  id="email"
  type="email"
  placeholder="Enter your email"
  required
>

<label for="message">Message</label>
<textarea
  id="message"
  placeholder="Write your message..."
  required
></textarea>

<button type="submit">
Send Message →
</button>

<p class="note">
We appreciate your feedback and suggestions.
</p>

</form>

</div>

</div>
</section>

</main>

<footer>
© 2026 AURA. All rights reserved.
</footer>

<script>

function sendMessage(event){

  event.preventDefault();

  alert(
    "Thank you for contacting AURA!\\n\\nYour message has been received."
  );

}

</script>

</body>
</html>
