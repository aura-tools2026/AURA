<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Age Calculator | AURA</title>
<meta name="description" content="Calculate your exact age in years, months and days with AURA.">
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#06101c;color:#edf8ff;font-family:Arial,sans-serif}
.app{max-width:650px;margin:20px auto}
header{text-align:center;margin-bottom:25px}
.brand{font-size:12px;letter-spacing:4px;color:#76eaff}
h1{font-size:32px;margin:14px 0}
h1 span{color:#35d9ff}
p{color:#a5bbce;line-height:1.6}
.panel{background:#0e1c2c;border:1px solid #215271;border-radius:20px;padding:22px;margin:18px 0;box-shadow:0 0 25px #00cfff0b}
label{display:block;margin:14px 0 8px;color:#c1eaff}
input{width:100%;padding:14px;background:#071321;border:1px solid #31536b;border-radius:10px;color:white;font-size:16px}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:#35d9ff;color:#03131c;font-weight:bold;font-size:15px;cursor:pointer}
.result{display:none;margin-top:20px}
.hero{background:#10283b;border:1px solid #276481;border-radius:15px;padding:20px;text-align:center}
.hero small{color:#a5d8ed}
.hero h2{font-size:29px;color:#48dfff;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.stat{padding:15px;border-radius:12px;background:#10283b;border:1px solid #24516a}
.stat span{display:block;color:#a5d8ed;font-size:12px}
.stat strong{display:block;color:#55dfff;font-size:23px;margin-top:8px;overflow-wrap:anywhere}
#status{color:#ffb9b9;font-size:14px}
.back{display:block;text-align:center;color:#55dfff;text-decoration:none;margin-top:25px}
</style>
</head>
<body>
<main class="app">
<header>
<div class="brand">A U R A / LIFE TOOLS</div>
<h1>AGE <span>CALCULATOR</span></h1>
<p>Discover your age down to the exact day.</p>
</header>

<section class="panel">
<label for="dob">YOUR DATE OF BIRTH</label>
<input type="date" id="dob">
<label for="asof">CALCULATE AGE AS OF</label>
<input type="date" id="asof">
<button id="calculate">CALCULATE MY AGE ↗</button>
<p id="status" role="status" aria-live="polite"></p>

<div class="result" id="result">
<div class="hero">
<small>YOUR EXACT AGE</small>
<h2 id="exactAge"></h2>
</div>
<div class="stats">
<div class="stat"><span>Total days lived</span><strong id="days"></strong></div>
<div class="stat"><span>Total weeks lived</span><strong id="weeks"></strong></div>
<div class="stat"><span>Next birthday in</span><strong id="birthday"></strong></div>
<div class="stat"><span>Day of birth</span><strong id="weekday"></strong></div>
</div>
</div>
</section>
<a class="back" href="index.html">← Back to AURA</a>
</main>

<script>
const dob=document.getElementById("dob");
const asof=document.getElementById("asof");
const result=document.getElementById("result");
const status=document.getElementById("status");

function dateString(d){
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
const today=new Date();
const localToday=new Date(today.getFullYear(),today.getMonth(),today.getDate());
asof.value=dateString(localToday);
dob.max=dateString(localToday);
asof.min="1900-01-01";

function parseDate(s){
 if(!s)return null;
 const [y,m,d]=s.split("-").map(Number);
 const date=new Date(y,m-1,d);
 return date.getFullYear()===y&&date.getMonth()===m-1&&date.getDate()===d?date:null;
}
function addYearsClamped(date,years){
 const y=date.getFullYear()+years,m=date.getMonth(),d=date.getDate();
 const last=new Date(y,m+1,0).getDate();
 return new Date(y,m,Math.min(d,last));
}
function addMonthsClamped(date,months){
 const total=date.getFullYear()*12+date.getMonth()+months;
 const y=Math.floor(total/12),m=((total%12)+12)%12;
 const d=Math.min(date.getDate(),new Date(y,m+1,0).getDate());
 return new Date(y,m,d);
}
function calculate(){
 status.textContent="";
 result.style.display="none";
 const birth=parseDate(dob.value), end=parseDate(asof.value);
 if(!birth||!end){status.textContent="Please select both dates.";return}
 if(birth>end){status.textContent="Date of birth must not be after the calculation date.";return}
 let years=end.getFullYear()-birth.getFullYear();
 let cursor=addYearsClamped(birth,years);
 if(cursor>end){years--;cursor=addYearsClamped(birth,years)}
 let months=0;
 while(months<11){
  const next=addMonthsClamped(cursor,1);
  if(next>end)break;
  cursor=next;months++;
 }
 const days=Math.round((end-cursor)/86400000);
 const totalDays=Math.round((end-birth)/86400000);
 let nextBirthday=addYearsClamped(birth,end.getFullYear()-birth.getFullYear());
 if(nextBirthday<=end)nextBirthday=addYearsClamped(birth,end.getFullYear()-birth.getFullYear()+1);
 const daysUntil=Math.round((nextBirthday-end)/86400000);
 document.getElementById("exactAge").textContent=years+" years, "+months+" months, "+days+" days";
 document.getElementById("days").textContent=totalDays.toLocaleString();
 document.getElementById("weeks").textContent=Math.floor(totalDays/7).toLocaleString();
 document.getElementById("birthday").textContent=daysUntil+" days";
 document.getElementById("weekday").textContent=birth.toLocaleDateString("en-US",{weekday:"long"});
 result.style.display="block";
}
document.getElementById("calculate").addEventListener("click",calculate);
</script>
</body>
</html>
